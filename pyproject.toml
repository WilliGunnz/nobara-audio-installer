[project]
name = "nobara-audio-installer"
version = "0.1.0"
description = "Nobara Audio Installer CLI and Publisher"
authors = [{ name = "Willi Gunnz" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "click>=8.0.0,<9.0.0",
    "rich>=13.0.0,<14.0.0",
    "packaging>=23.0",
    "PyQt6>=6.5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
nai = "nai.cli.app:app"
nai-gui = "nai.gui.launch:launch"
